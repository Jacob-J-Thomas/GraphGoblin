# GraphGoblin for one user on a trusted network. See docs/guide/01-install-and-first-run.md.
#
#   docker compose up -d --build
#   open http://127.0.0.1:4747/app/
name: graphgoblin
services:
  graphgoblin:
    build: .
    image: graphgoblin:local
    restart: unless-stopped
    init: true
    # Allow active Codex turns to settle and release the volume lock before Docker sends SIGKILL.
    stop_grace_period: 90s
    ports:
      # Published on the host's loopback only. Widen it only together with GG_REQUIRE_API_KEY.
      - '127.0.0.1:4747:4747'
    environment:
      GG_DEFAULTS: '{"byHarness":{"codex":{"model":"gpt-6-luna","effort":"low"}}}'
      # Seed the encrypted Jev secret from the host environment; an existing secret wins.
      # GG_JEV_API_KEY: ${GG_JEV_API_KEY-${JEV_API_KEY-}}
      # Require API keys for every non-public route; stop the API, create the first key, restart:
      #   docker compose stop graphgoblin
      #   docker compose run --rm graphgoblin node apps/api/dist/main.js --create-api-key <name>
      #   docker compose up -d graphgoblin
      # GG_REQUIRE_API_KEY: 'true'
      # Codex with an API key instead of the mounted login:
      # OPENAI_API_KEY: sk-...
    volumes:
      - graphgoblin-data:/data
      # The host's Codex login (run `codex login` on the host first). Read-write: Codex refreshes
      # its tokens. On Windows use %USERPROFILE%/.codex.
      - ${HOME:-${USERPROFILE}}/.codex:/home/node/.codex

volumes:
  graphgoblin-data:
