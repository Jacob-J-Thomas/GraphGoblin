# QA-ONLY disposable control (#496). Commit on a throwaway branch `qa/gg-496-candidate-negative`
# created from the EXACT frozen candidate commit, adding only this file and
# tooling/scripts/windows-launcher.qa-negative.acceptance.mjs (generated by
# qa/make-negative-acceptance.py from that candidate's suite). Never merge.
name: QA 496 candidate negative evidence

on:
  push:
    branches: [qa/gg-496-candidate-negative]

permissions:
  contents: read

jobs:
  # Same steps as the candidate Windows job; the native step runs the QA negative suite with
  # canary environment values. Expected: native step fails (installer exit 7, retained junction),
  # evidence status native-failed, observations valid with overflow and one rejected record,
  # and no canary or path in the downloaded archive.
  windows-launcher-negative:
    name: Windows launcher negative evidence
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LIVE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Prepare native evidence
        id: evidence
        env:
          GG_TEST_EVIDENCE_EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GG_TEST_EVIDENCE_EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: node tooling/scripts/windows-launcher-evidence.mjs init
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile
      - name: Build
        id: build
        run: pnpm build
      - name: QA negative native acceptance
        id: native
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GG_TEST_WINDOWS_LAUNCHER_EVIDENCE_DIR: ${{ steps.evidence.outputs.dir }}
          QA_496_CANARY: QA496-${{ github.run_id }}-${{ github.run_attempt }}
          GG_QA_496_ENV_CANARY: QA496-${{ github.run_id }}-${{ github.run_attempt }}-ENV
          QA_496_PLAIN_ENV_CANARY: QA496-${{ github.run_id }}-${{ github.run_attempt }}-PLAINENV
        run: node --test tooling/scripts/windows-launcher.qa-negative.acceptance.mjs
      - name: Finalize native evidence
        id: finalize
        if: ${{ always() && steps.evidence.outputs.dir != '' }}
        env:
          GG_TEST_WINDOWS_LAUNCHER_EVIDENCE_DIR: ${{ steps.evidence.outputs.dir }}
          GG_TEST_WINDOWS_LAUNCHER_EVIDENCE_ID: ${{ steps.evidence.outputs.id }}
          GG_TEST_EVIDENCE_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          GG_TEST_EVIDENCE_BUILD_OUTCOME: ${{ steps.build.outcome }}
          GG_TEST_EVIDENCE_NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: node tooling/scripts/windows-launcher-evidence.mjs finalize
      - name: Upload native evidence
        id: upload
        if: ${{ always() && steps.finalize.outputs.paths != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa496-negative-windows-launcher-${{ github.run_attempt }}
          path: ${{ steps.finalize.outputs.paths }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
      - name: Uploader outputs
        if: always()
        shell: pwsh
        env:
          ID: ${{ steps.upload.outputs.artifact-id }}
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          STATUS: ${{ steps.finalize.outputs.status }}
        run: |
          [pscustomobject]@{ evidence = 'qa-496-negative-upload'; id = $env:ID; digest = $env:DIGEST; status = $env:STATUS } | ConvertTo-Json -Compress

  # Finalize must refuse a planted hard link (and a planted junction) without writing, following
  # or uploading. Expected: both finalize steps fail with the named refusal; no artifact.
  evidence-refusal:
    name: Evidence refusal control
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare evidence and plant a hard link to an outside canary
        id: evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node tooling/scripts/windows-launcher-evidence.mjs init
          if ($LASTEXITCODE -ne 0) { throw 'init failed' }
          $values = @{}
          Get-Content -LiteralPath $env:GITHUB_OUTPUT | ForEach-Object { if ($_ -match '^(dir|id)=(.*)$') { $values[$Matches[1]] = $Matches[2] } }
          $outside = Join-Path $env:RUNNER_TEMP 'qa496-outside-store.db'
          [IO.File]::WriteAllText($outside, "QA496-$env:GITHUB_RUN_ID-HARDLINK-CANARY")
          New-Item -ItemType HardLink -Path (Join-Path $values.dir 'observations.ndjson') -Target $outside | Out-Null
      - name: Finalize must refuse the hard link
        id: finalize
        continue-on-error: true
        env:
          GG_TEST_WINDOWS_LAUNCHER_EVIDENCE_DIR: ${{ steps.evidence.outputs.dir }}
          GG_TEST_WINDOWS_LAUNCHER_EVIDENCE_ID: ${{ steps.evidence.outputs.id }}
          GG_TEST_EVIDENCE_INSTALL_OUTCOME: success
          GG_TEST_EVIDENCE_BUILD_OUTCOME: success
          GG_TEST_EVIDENCE_NATIVE_OUTCOME: success
        run: node tooling/scripts/windows-launcher-evidence.mjs finalize
      - name: Upload must be skipped
        if: ${{ always() && steps.finalize.outputs.paths != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa496-refusal-must-not-exist-${{ github.run_attempt }}
          path: ${{ steps.finalize.outputs.paths }}
          retention-days: 1
      - name: Assert refusal without writes
        if: always()
        shell: pwsh
        env:
          DIR: ${{ steps.evidence.outputs.dir }}
          OUTCOME: ${{ steps.finalize.outcome }}
          PATHS: ${{ steps.finalize.outputs.paths }}
        run: |
          $ErrorActionPreference = 'Stop'
          $entries = @(Get-ChildItem -LiteralPath $env:DIR -Force | ForEach-Object Name | Sort-Object)
          $outside = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'qa496-outside-store.db') -Raw
          [pscustomobject]@{ evidence = 'qa-496-refusal'; finalize = $env:OUTCOME; paths = $env:PATHS; entries = $entries; outsideUnchanged = ($outside -eq "QA496-$env:GITHUB_RUN_ID-HARDLINK-CANARY") } | ConvertTo-Json -Compress
          if ($env:OUTCOME -ne 'failure' -or $env:PATHS -ne '' -or ($entries -contains 'result.json')) { throw 'Refusal control failed.' }
