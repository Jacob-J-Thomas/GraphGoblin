<!doctype html>
<!-- Dark is the default theme and Geist the default font. The build adds, right after the charset,
     the theme-color meta tag (both themes' colours, from the design tokens) and the scripts that
     show the theme and the font chosen in Settings before first paint; the font script also
     preloads that font's files (vite.config.ts, src/lib/theme.ts, src/lib/font.ts). -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Design, run, and observe agent loops." />
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <link rel="apple-touch-icon" href="/app/icons/icon-192.png" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <title>GraphGoblin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
