packages:
  - packages/*
  - apps/*
  - tooling

# Drizzle Kit does not import this deprecated loader; remove its unused esbuild chain.
overrides:
  '@esbuild-kit/esm-loader': '-'

# Dependency lifecycle scripts allowed to run (pnpm blocks all others). esbuild only validates its binary.
allowBuilds:
  esbuild: true

patchedDependencies:
  '@openai/codex-sdk@0.160.0': patches/@openai__codex-sdk@0.160.0.patch
