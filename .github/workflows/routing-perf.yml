name: Routing performance

on:
  workflow_dispatch:
    inputs:
      strict:
        description: Enforce the strict bounds (median routing p95 <4 ms, frame p95 <17 ms). The shared runner's own spread straddles 4 ms.
        type: boolean
        default: false
  pull_request:
    paths:
      - 'apps/web/src/editor/**'
      - 'apps/web/e2e/routing.spec.ts'

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GG_E2E_BROWSER_CHANNEL: msedge
      GG_ROUTING_REPORT_DIR: ${{ github.workspace }}/routing-performance
      # Every run enforces median of three routing p95s <8 ms and each drag's routing
      # p95 <16 ms: the shared two-core runner measured 0.8-5.2 ms for the same code.
      # A manual dispatch with Strict set enforces the issue's bounds instead: median
      # <4 ms and frame p95 <17 ms (the 60 Hz budget; timestamps land 0.1 ms past one
      # vsync). The shared runner's own spread straddles 4 ms (3.2 / 2.6, 4.7 / 4.3 and
      # 3.7 / 3.7 ms on three runs of the same code), so a strict failure there calls for
      # a look at the numbers rather than a verdict.
      # Added frame time is reported, without a bound, because idle cadence can differ.
      GG_ROUTING_STRICT_PERF: ${{ inputs.strict && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Edge
        run: pnpm --filter @graphgoblin/web exec playwright install --with-deps msedge
      - name: Build
        run: pnpm build
      - name: Measure three drags at 100 and 300 nodes
        run: pnpm --filter @graphgoblin/web exec playwright test e2e/routing.spec.ts --grep 'performance:' --retries=0
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, appendFile } from 'node:fs/promises';
          const folder = process.env.GG_ROUTING_REPORT_DIR;
          const files = await readdir(folder).catch(() => []);
          const rows = ['# Routing performance', '', 'Whole cache miss includes geometry preparation, invalidation, routing and identity reuse. Limits: median of three routing p95s <8 ms; strict manual dispatch: <4 ms and frame p95 <17 ms (the 60 Hz budget; timestamps land 0.1 ms past one vsync). Every drag: routing p95 <16 ms.', '', '| Nodes | Browser | Drag | Routing p95 | Fixture median | Idle frame p95 | Drag frame p95 | Added frame p95 |', '| --- | --- | --- | --- | --- | --- | --- | --- |'];
          for (const file of files.filter(f => f.endsWith('.json')).sort()) {
            const report = JSON.parse(await readFile(folder + '/' + file, 'utf8'));
            for (const run of report.repetitions) rows.push(`| ${report.nodes} | ${report.channel} ${report.browser} | ${run.repetition} | ${run.routingP95Ms.toFixed(3)} ms | ${report.medianRoutingP95Ms.toFixed(3)} ms | ${report.idle.frameP95Ms.toFixed(3)} ms | ${run.frameP95Ms.toFixed(3)} ms | ${run.addedFrameP95Ms.toFixed(3)} ms |`);
          }
          if (!files.length) rows.push('', 'No measurement report was produced; inspect the failed setup/test step.');
          await appendFile(process.env.GITHUB_STEP_SUMMARY, rows.join('\n') + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-performance
          path: routing-performance/*.json
          if-no-files-found: warn
