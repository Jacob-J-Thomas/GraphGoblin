# QA-ONLY disposable #496 control generated from the frozen corrected candidate ci.yml. Never merge.
# Branch codex/qa/gg-496-candidate-negative from the EXACT frozen corrected candidate commit,
# adding only this file and tooling/scripts/windows-launcher.qa-negative.acceptance.mjs
# (generated by make-negative-acceptance.py from that candidate's suite).
name: QA 496 candidate negative evidence

on:
  push:
    branches: [codex/qa/gg-496-typed-marker-negative]

permissions:
  contents: read

jobs:
  windows-launcher-negative:
    name: Windows launcher negative evidence
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LIVE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile
      - name: Build
        id: build
        run: pnpm build
      # Native evidence (#496): a fresh, non-hidden folder directly below the runner temp,
      # outside the checkout and every fixture. The suite writes typed records only. Prepared
      # after the build, so its failure can never skip install, build or the native command; it
      # needs only the checkout and Node, so a failed install or build is still recorded.
      - name: Prepare native evidence
        id: evidence
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        env:
          GG_TEST_EVIDENCE_EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GG_TEST_EVIDENCE_EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: node tooling/scripts/windows-launcher-evidence.mjs init
      - name: QA negative native acceptance
        id: native
        # Runs after a successful build whatever evidence preparation did. A preparation failure
        # still fails the job, and the suite then receives no evidence folder.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GG_TEST_WINDOWS_LAUNCHER_EVIDENCE_DIR: ${{ steps.evidence.outcome == 'success' && steps.evidence.outputs.dir || '' }}
          QA_496_CANARY: QA496-${{ github.run_id }}-${{ github.run_attempt }}
          GG_QA_496_ENV_CANARY: QA496-${{ github.run_id }}-${{ github.run_attempt }}-ENV
          QA_496_PLAIN_ENV_CANARY: QA496-${{ github.run_id }}-${{ github.run_attempt }}-PLAINENV
        # QA-ONLY INJECTION: the generated negative suite instead of the exact command.
        run: node --test tooling/scripts/windows-launcher.qa-negative.acceptance.mjs
      - name: Finalize native evidence
        id: finalize
        # Only a successfully prepared folder is finalized, and only finalized files are uploaded.
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        env:
          GG_TEST_WINDOWS_LAUNCHER_EVIDENCE_DIR: ${{ steps.evidence.outputs.dir }}
          GG_TEST_WINDOWS_LAUNCHER_EVIDENCE_ID: ${{ steps.evidence.outputs.id }}
          GG_TEST_EVIDENCE_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          GG_TEST_EVIDENCE_BUILD_OUTCOME: ${{ steps.build.outcome }}
          GG_TEST_EVIDENCE_NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: node tooling/scripts/windows-launcher-evidence.mjs finalize
      - name: Upload native evidence
        id: upload
        if: ${{ always() && steps.finalize.outputs.paths != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa496-negative-windows-launcher-${{ github.run_attempt }}
          path: ${{ steps.finalize.outputs.paths }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
      - name: QA readback (prints facts, never fails)
        if: always()
        shell: pwsh
        env:
          PREPARE: ${{ steps.evidence.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          NATIVE: ${{ steps.native.outcome }}
          FINALIZE: ${{ steps.finalize.outcome }}
          STATUS: ${{ steps.finalize.outputs.status }}
          PATHS: ${{ steps.finalize.outputs.paths }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          $temp = @(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Force -Filter 'windows-launcher-evidence-*' | ForEach-Object Name)
          $checkout = @(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force -Filter 'windows-launcher-evidence-*' | ForEach-Object Name)
          [ordered]@{ evidence = 'qa-496-negative-upload'; prepare = $env:PREPARE; install = $env:INSTALL; build = $env:BUILD; native = $env:NATIVE; finalize = $env:FINALIZE; status = $env:STATUS; paths = $env:PATHS; artifactId = $env:ARTIFACT_ID; artifactDigest = $env:ARTIFACT_DIGEST; runnerTempEvidence = $temp; checkoutEvidence = $checkout } | ConvertTo-Json -Compress
  # Finalize must refuse a planted hard link and a manifest carrying an unknown field, without
  # writing, following or uploading. Expected: both finalize steps fail with the named refusal,
  # no upload step runs, no result.json appears, the outside canary is unchanged, and the
  # assertion step (and so this job) succeeds.
  evidence-refusal:
    name: Evidence refusal control
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare two evidence folders and plant a hard link and a manifest field
        id: evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folders = foreach ($case in 'hardlink', 'manifest') {
            $env:GITHUB_OUTPUT_SAVED = $env:GITHUB_OUTPUT
            $env:GITHUB_OUTPUT = Join-Path $env:RUNNER_TEMP "qa496-$case-output.txt"
            node tooling/scripts/windows-launcher-evidence.mjs init | Out-Host
            $initCode = $LASTEXITCODE
            if ($initCode -ne 0) { throw "init failed for $case" }
            $values = @{}
            Get-Content -LiteralPath $env:GITHUB_OUTPUT | ForEach-Object { if ($_ -match '^(dir|id)=(.*)$') { $values[$Matches[1]] = $Matches[2] } }
            $env:GITHUB_OUTPUT = $env:GITHUB_OUTPUT_SAVED
            [pscustomobject]@{ case = $case; dir = $values.dir; id = $values.id }
          }
          $outside = Join-Path $env:RUNNER_TEMP 'qa496-outside-store.db'
          [IO.File]::WriteAllText($outside, "QA496-$env:GITHUB_RUN_ID-HARDLINK-CANARY")
          New-Item -ItemType HardLink -Path (Join-Path $folders[0].dir 'observations.ndjson') -Target $outside | Out-Null
          $manifest = Join-Path $folders[1].dir 'manifest.json'
          $text = [IO.File]::ReadAllText($manifest)
          [IO.File]::WriteAllText($manifest, $text.Insert(1, "`n  `"path`": `"QA496-$env:GITHUB_RUN_ID-MANIFEST-CANARY`","), [Text.UTF8Encoding]::new($false))
          "hardlink_dir=$($folders[0].dir)", "hardlink_id=$($folders[0].id)", "manifest_dir=$($folders[1].dir)", "manifest_id=$($folders[1].id)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Finalize must refuse the hard link
        id: finalize_hardlink
        continue-on-error: true
        env:
          GG_TEST_WINDOWS_LAUNCHER_EVIDENCE_DIR: ${{ steps.evidence.outputs.hardlink_dir }}
          GG_TEST_WINDOWS_LAUNCHER_EVIDENCE_ID: ${{ steps.evidence.outputs.hardlink_id }}
          GG_TEST_EVIDENCE_INSTALL_OUTCOME: success
          GG_TEST_EVIDENCE_BUILD_OUTCOME: success
          GG_TEST_EVIDENCE_NATIVE_OUTCOME: success
        run: node tooling/scripts/windows-launcher-evidence.mjs finalize
      - name: Finalize must refuse the manifest field
        id: finalize_manifest
        continue-on-error: true
        env:
          GG_TEST_WINDOWS_LAUNCHER_EVIDENCE_DIR: ${{ steps.evidence.outputs.manifest_dir }}
          GG_TEST_WINDOWS_LAUNCHER_EVIDENCE_ID: ${{ steps.evidence.outputs.manifest_id }}
          GG_TEST_EVIDENCE_INSTALL_OUTCOME: success
          GG_TEST_EVIDENCE_BUILD_OUTCOME: success
          GG_TEST_EVIDENCE_NATIVE_OUTCOME: skipped
        run: node tooling/scripts/windows-launcher-evidence.mjs finalize
      - name: Upload must be skipped (hard link)
        if: ${{ always() && steps.finalize_hardlink.outputs.paths != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa496-refusal-hardlink-must-not-exist-${{ github.run_attempt }}
          path: ${{ steps.finalize_hardlink.outputs.paths }}
          retention-days: 1
      - name: Upload must be skipped (manifest)
        if: ${{ always() && steps.finalize_manifest.outputs.paths != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa496-refusal-manifest-must-not-exist-${{ github.run_attempt }}
          path: ${{ steps.finalize_manifest.outputs.paths }}
          retention-days: 1
      - name: Assert refusals without writes
        if: always()
        shell: pwsh
        env:
          HARDLINK_DIR: ${{ steps.evidence.outputs.hardlink_dir }}
          MANIFEST_DIR: ${{ steps.evidence.outputs.manifest_dir }}
          HARDLINK_OUTCOME: ${{ steps.finalize_hardlink.outcome }}
          MANIFEST_OUTCOME: ${{ steps.finalize_manifest.outcome }}
          HARDLINK_PATHS: ${{ steps.finalize_hardlink.outputs.paths }}
          MANIFEST_PATHS: ${{ steps.finalize_manifest.outputs.paths }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hardlink = @(Get-ChildItem -LiteralPath $env:HARDLINK_DIR -Force | ForEach-Object Name | Sort-Object)
          $manifest = @(Get-ChildItem -LiteralPath $env:MANIFEST_DIR -Force | ForEach-Object Name | Sort-Object)
          $outside = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'qa496-outside-store.db') -Raw
          $report = [ordered]@{ evidence = 'qa-496-refusal'; hardlink = $env:HARDLINK_OUTCOME; manifest = $env:MANIFEST_OUTCOME; hardlinkPaths = $env:HARDLINK_PATHS; manifestPaths = $env:MANIFEST_PATHS; hardlinkEntries = $hardlink; manifestEntries = $manifest; outsideUnchanged = ($outside -eq "QA496-$env:GITHUB_RUN_ID-HARDLINK-CANARY") }
          $report | ConvertTo-Json -Compress
          if ($env:HARDLINK_OUTCOME -ne 'failure' -or $env:MANIFEST_OUTCOME -ne 'failure' -or $env:HARDLINK_PATHS -ne '' -or $env:MANIFEST_PATHS -ne '' -or ($hardlink -contains 'result.json') -or ($manifest -contains 'result.json') -or -not $report.outsideUnchanged) { throw 'Refusal control failed.' }
