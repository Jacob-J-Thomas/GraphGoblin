name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Offline upgrade acceptance
        run: pnpm test:upgrade

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Layer rules
        run: pnpm check:layers

      - name: Design token rules
        run: pnpm check:tokens

      - name: Dependency graph rules
        run: pnpm check:deps

      - name: Unit tests with coverage thresholds
        run: pnpm test:coverage

      - name: Licence allowlist
        run: pnpm check:licenses

      - name: Generated docs are current
        run: pnpm check:docs

      - name: Design token contrast table is current and passing
        run: pnpm check:contrast

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/coverage-summary.json
            apps/*/coverage/coverage-summary.json
          if-no-files-found: ignore
