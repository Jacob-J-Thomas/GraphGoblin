name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Recovery process acceptance
        run: pnpm test:recovery-process

      - name: Wait restart acceptance
        run: pnpm test:wait-restart

      - name: Prompt restart acceptance
        run: pnpm test:prompt-restart
      - name: Webhook retry acceptance
        run: pnpm test:webhook-retry

      - name: Offline upgrade acceptance
        run: pnpm test:upgrade

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Layer rules
        run: pnpm check:layers

      - name: Migration generation is a no-op
        run: pnpm check:migrations

      - name: Design token rules
        run: pnpm check:tokens

      - name: Dependency graph rules
        run: pnpm check:deps

      - name: Shipped templates and deliberate-invalid refusal
        run: pnpm check:templates

      - name: Unit tests with coverage thresholds
        # Each Vitest package owns its worker pool; avoid multiplying pools on the CI host.
        run: pnpm exec turbo run test:coverage --concurrency=1

      - name: Licence allowlist
        run: pnpm check:licenses

      - name: Generated docs are current
        run: pnpm check:docs

      - name: Design token contrast table is current and passing
        run: pnpm check:contrast

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/coverage-summary.json
            apps/*/coverage/coverage-summary.json
          if-no-files-found: ignore

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Match Windows development and the existing Linux routing-performance job.
      GG_E2E_BROWSER_CHANNEL: msedge
      # Live checks spend subscription quota and require an installed, signed-in CLI.
      LIVE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          # issue-170-qa reads frozen golden definitions from an earlier commit with git ls-tree.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Edge
        run: pnpm --filter @graphgoblin/web exec playwright install --with-deps msedge

      - name: Build
        run: pnpm build

      - name: Functional browser suite (no retries)
        timeout-minutes: 60
        working-directory: apps/web
        run: pnpm exec playwright test --retries=0 --workers=1

      - name: Browser coverage and exclusions
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Functional browser gate

          Selected coverage: all `apps/web/e2e/**/*.spec.ts` against the built app on Edge with zero retries and one worker.
          The test step and report record the executed result, including any setup failure.
          The real API uses disposable storage and scripted harness/classifier boundaries; no paid provider is called.

          Skipped: `live.spec.ts` / `LIVE: build, publish, and run an inference loop against Codex from the UI`.
          It requires `LIVE=1`, an installed Codex CLI and a provider login, and spends subscription quota. CI sets `LIVE=0`.
          No other functional spec or test is skipped or gated on a provider login or installed CLI.

          Optional modes are off: `GG_FORMS_QA_PHASE` (historical before/after captures),
          `GG_ROUTING_SCREENSHOTS` (captures), `GG_ROUTING_PROFILE` (profiling), and
          `GG_ROUTING_STRICT_PERF` (stricter manual performance bounds). Their ordinary tests still run.
          `screens.capture.ts` is a manual screenshot utility, outside the `*.spec.ts` suite.
          Live/paid checks remain separate, manually authorized checks; this job schedules none.
          SUMMARY

      - name: Upload browser failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: warn

  template-image:
    name: Template image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the distributed image
        run: docker build --tag graphgoblin-template-check .

      - name: Load installed templates without network or writable storage
        run: |
          docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node graphgoblin-template-check --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync, readdirSync } from 'node:fs';
          import { TemplateCatalog } from '/app/apps/api/dist/templates/catalog.js';
          const catalog = new TemplateCatalog('/app/apps/api/dist/catalog');
          const entries = await catalog.list();
          assert.deepEqual(entries.map(({ manifest }) => manifest.id).sort(),
            ['implementation', 'qa', 'review', 'starter']);
          const assetFiles = (root) => readdirSync(root, { withFileTypes: true }).flatMap((entry) =>
            entry.isDirectory() ? assetFiles(`${root}/${entry.name}`).map((file) => `${entry.name}/${file}`)
              : [entry.name]).sort();
          const keptFiles = ['catalog.json', ...entries.flatMap(({ manifest }) =>
            [`${manifest.id}/manifest.json`, `${manifest.id}/draft.json`])].sort();
          for (const root of ['/app/apps/api/templates', '/app/apps/api/dist/catalog']) {
            assert.deepEqual(assetFiles(root), keptFiles,
              'Only the index, manifests and independent drafts may ship; no configured graphs or support assets');
          }
          const supportDir = '/app/apps/api/dist/templates/github';
          assert.deepEqual(existsSync(supportDir) ? readdirSync(supportDir, { recursive: true }) : [], []);
          for (const name of ['runtime', 'binding', 'scripts', 'authority', 'prerequisites',
            'subjects', 'failures', 'support-result', 'instances']) {
            assert.equal(existsSync(`/app/apps/api/dist/templates/${name}.js`), false);
          }
          for (const { manifest, draft } of entries) {
            assert.ok(draft.nodes.length > 0);
            const first = await catalog.draft(manifest.id);
            const second = await catalog.draft(manifest.id);
            assert.deepEqual(first, draft);
            assert.notEqual(first, second);
            first.nodes[0].label = 'Changed copy';
            assert.deepEqual(second, draft);
            assert.deepEqual(await catalog.draft(manifest.id), draft);
            console.log(JSON.stringify({ template: manifest.id, version: manifest.version,
              draftNodes: draft.nodes.length }));
          }
          JS
