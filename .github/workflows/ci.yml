name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-launcher:
    name: Windows launcher
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LIVE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Native Windows launcher acceptance
        run: pnpm test:windows-launcher
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher
          path: .tmp/windows-launcher-*/
          if-no-files-found: warn
      # Append to the Windows job of the restored ordinary workflow. Checkout needs fetch-depth: 2.
      - name: Admitted #436 Shell Link property-store diagnostic
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 497 && github.run_attempt == '1'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1' -or $env:GITHUB_EVENT_NAME -cne 'pull_request') {
            throw 'The diagnostic requires its admitted first hosted Windows run.'
          }
          $root = Join-Path $env:RUNNER_TEMP "qa436-com-probe-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          if (Test-Path -LiteralPath $root) { throw 'Diagnostic output already exists.' }
          New-Item -ItemType Directory -Path $root | Out-Null
          function Save([string]$Name, $Data) {
            $path = Join-Path $root "$Name.json"
            $file = [IO.File]::Open($path, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::Read)
            try { $file.Write([Text.Encoding]::UTF8.GetBytes((ConvertTo-Json -InputObject $Data -Depth 12) + [char]10)); $file.Flush($true) }
            finally { $file.Dispose() }
          }
          function Read-Git([string]$Revision) {
            $value = git rev-parse --verify $Revision
            if ($LASTEXITCODE -ne 0 -or $value -cnotmatch '^[0-9a-f]{40}$') { throw "Git identity unavailable: $Revision" }
            return $value
          }
          $expectedBase = 'be633141be5a0cd2b4f960a46761fabbf2cb82c7'
          $event = Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json -AsHashtable
          $head = Read-Git 'HEAD'
          $tree = Read-Git 'HEAD^{tree}'
          $firstParent = Read-Git 'HEAD^1'
          $secondParent = Read-Git 'HEAD^2'
          if ($event.number -ne 497 -or $head -cne $env:GITHUB_SHA -or $firstParent -cne $expectedBase -or
              $firstParent -cne $event.pull_request.base.sha -or $secondParent -cne $event.pull_request.head.sha -or
              $tree -cne (Read-Git ($secondParent + '^{tree}'))) { throw 'The actual diagnostic merge identity was not admitted.' }
          git diff --quiet $expectedBase $head -- . ':!.github/workflows/ci.yml' ':!docs/qa/.gitattributes' ':!docs/qa/2026-11-16-installer-validation-preparation'
          if ($LASTEXITCODE -ne 0) { throw 'Product inputs differ from the exact post-#435 baseline.' }
          $raw = Join-Path $env:GITHUB_WORKSPACE 'docs\qa\2026-11-16-installer-validation-preparation\raw'
          $probe = Join-Path $raw 'com-probe\probe.ps1'
          $property = Join-Path $raw 'com-probe\PropertyStoreProbe.cs'
          $native = Join-Path $raw 'native\windows.cs'
          $inputs = [ordered]@{
            $probe = 'fdf8d5600f540794231bfec33cfd61957ff18c8860d7e0ea7595410c61dae81f'
            $property = 'd54e13b588e2e283b0cb6744ae18ceb8adba3ba4c1cce82773ddaed43e6de529'
            $native = '4488dd959fd5c27ccfabbca5f67b93af616dcce8e24b9b7a128cc671ca89c049'
          }
          function Confirm-Inputs {
            foreach ($file in $inputs.Keys) {
              if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $inputs[$file]) {
                throw "Diagnostic input changed: $file"
              }
            }
          }
          Confirm-Inputs
          $exe = (Get-Process -Id $PID).Path
          $arguments = @('-NoLogo','-NoProfile','-NonInteractive','-STA','-File',$probe,
            '-AttemptRoot',$root,'-NativeHelper',$native,'-PropertyHelperSha256',$inputs[$property],'-CheckoutHead',$head)
          Save 'attempt' ([ordered]@{ run=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT; pull=497
            head=$head; tree=$tree; parents=@($firstParent,$secondParent); executable=$exe
            executableSha256=(Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
            arguments=$arguments; inputs=$inputs; exitDeadlineMs=45000; closeDeadlineMs=5000 })
          $info = [Diagnostics.ProcessStartInfo]::new($exe)
          $info.UseShellExecute = $false
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          $info.WorkingDirectory = $env:GITHUB_WORKSPACE
          foreach ($value in $arguments) { $info.ArgumentList.Add($value) }
          $out = [IO.File]::Open((Join-Path $root 'stdout.txt'), [IO.FileMode]::CreateNew)
          $err = [IO.File]::Open((Join-Path $root 'stderr.txt'), [IO.FileMode]::CreateNew)
          $child = $null
          $stage = 'start'
          try {
            $child = [Diagnostics.Process]::Start($info)
            $pipes = [Threading.Tasks.Task[]]@($child.StandardOutput.BaseStream.CopyToAsync($out),
              $child.StandardError.BaseStream.CopyToAsync($err))
            $birth = $child.StartTime.ToUniversalTime().ToString('o')
            Save 'spawn' @{ pid=$child.Id; birthUtc=$birth; parentPid=$PID }
            $stage = 'native exit'
            if (!$child.WaitForExit(45000)) { throw 'Child exit deadline elapsed.' }
            Save 'exit' @{ pid=$child.Id; birthUtc=$birth; exitCode=$child.ExitCode; exitUtc=$child.ExitTime.ToUniversalTime().ToString('o') }
            $stage = 'pipe close'
            if (![Threading.Tasks.Task]::WaitAll($pipes, 5000)) { throw 'The independent pipe close deadline elapsed.' }
            $out.Flush($true)
            $err.Flush($true)
            Save 'close' @{ pid=$child.Id; streamsClosed=$true; closedUtc=[DateTime]::UtcNow.ToString('o')
              stdoutBytes=$out.Length; stderrBytes=$err.Length }
            $stage = 'closing input verification'
            Confirm-Inputs
            if ((Read-Git 'HEAD') -cne $head -or (Read-Git 'HEAD^{tree}') -cne $tree) { throw 'Checkout changed during the probe.' }
            $stage = 'diagnostic summary'
            $summary = Get-Content -Raw -LiteralPath (Join-Path $root 'probe\summary.json') | ConvertFrom-Json -AsHashtable
            if ($child.ExitCode -ne 0 -or $summary.status -cne 'diagnostic-complete' -or $summary.recordedCases -ne 2) {
              throw 'The diagnostic did not record both cases.'
            }
            Save 'result' @{ status='diagnostic-complete'; closingIdentityVerified=$true; recordedCases=2 }
          } catch {
            Save 'first-failure' @{ stage=$stage; message=$_.Exception.Message; stack=$_.ScriptStackTrace }
            throw
          } finally {
            $out.Dispose()
            $err.Dispose()
            if ($child) { $child.Dispose() }
          }

      - name: Retain #436 Shell Link diagnostic evidence
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 497 && github.run_attempt == '1'
        uses: actions/upload-artifact@v4
        with:
          name: qa436-com-probe-first
          path: ${{ runner.temp }}/qa436-com-probe-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Reset acceptance
        run: pnpm test:reset

      - name: Recovery process acceptance
        run: pnpm test:recovery-process

      - name: Chat restart acceptance
        run: pnpm test:chat-restart

      - name: Wait restart acceptance
        run: pnpm test:wait-restart

      - name: Prompt restart acceptance
        run: pnpm test:prompt-restart
      - name: Webhook retry acceptance
        run: pnpm test:webhook-retry

      - name: Current-format migration acceptance
        run: pnpm test:upgrade

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Layer rules
        run: pnpm check:layers

      - name: Migration generation is a no-op
        run: pnpm check:migrations

      - name: Design token rules
        run: pnpm check:tokens

      - name: Dependency graph rules
        run: pnpm check:deps

      - name: Shipped templates and deliberate-invalid refusal
        run: pnpm check:templates

      - name: Install Chromium for tooling browser measurements
        run: pnpm --filter @graphgoblin/web exec playwright install --with-deps chromium

      - name: Unit tests with coverage thresholds
        # Each Vitest package owns its worker pool; avoid multiplying pools on the CI host.
        run: pnpm exec turbo run test:coverage --concurrency=1

      - name: Licence allowlist
        run: pnpm check:licenses

      - name: Generated docs are current
        run: pnpm check:docs

      - name: Design token contrast table is current and passing
        run: pnpm check:contrast

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/coverage-summary.json
            apps/*/coverage/coverage-summary.json
            tooling/coverage/coverage-summary.json
          if-no-files-found: ignore

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Match Windows development and the existing Linux routing-performance job.
      GG_E2E_BROWSER_CHANNEL: msedge
      # Live checks spend subscription quota and require an installed, signed-in CLI.
      LIVE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          # issue-170-qa reads frozen golden definitions from an earlier commit with git ls-tree.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Edge
        run: pnpm --filter @graphgoblin/web exec playwright install --with-deps msedge

      - name: Build
        run: pnpm build

      - name: Functional browser suite (no retries)
        timeout-minutes: 60
        working-directory: apps/web
        run: pnpm exec playwright test --retries=0 --workers=1

      - name: Browser coverage and exclusions
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Functional browser gate

          Selected coverage: all `apps/web/e2e/**/*.spec.ts` against the built app on Edge with zero retries and one worker.
          This includes `script-recovery.spec.ts`: an isolated built API, kill/restart uncertainty, explicit retry consent, and resumed-run observation.
          The test step and report record the executed result, including any setup failure.
          The real API uses disposable storage and scripted harness/classifier boundaries; no paid provider is called.

          Skipped: `live.spec.ts` / `LIVE: build, publish, and run an inference loop against Codex from the UI`.
          It requires `LIVE=1`, an installed Codex CLI and a provider login, and spends subscription quota. CI sets `LIVE=0`.
          No other functional spec or test is skipped or gated on a provider login or installed CLI.

          Optional modes are off: `GG_FORMS_QA_PHASE` (historical before/after captures),
          `GG_ROUTING_SCREENSHOTS` (captures), `GG_ROUTING_PROFILE` (profiling), and
          `GG_ROUTING_STRICT_PERF` (stricter manual performance bounds). Their ordinary tests still run.
          `screens.capture.ts` is a manual screenshot utility, outside the `*.spec.ts` suite.
          Live/paid checks remain separate, manually authorized checks; this job schedules none.
          SUMMARY

      - name: Upload browser failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: warn

  template-image:
    name: Template image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the distributed image
        run: docker build --tag graphgoblin-template-check .

      - name: Load installed templates without network or writable storage
        run: |
          docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node graphgoblin-template-check --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync, readdirSync } from 'node:fs';
          import { TemplateCatalog } from '/app/apps/api/dist/templates/catalog.js';
          const catalog = new TemplateCatalog('/app/apps/api/dist/catalog');
          const entries = await catalog.list();
          assert.deepEqual(entries.map(({ manifest }) => manifest.id).sort(),
            ['implementation', 'qa', 'review', 'starter']);
          const assetFiles = (root) => readdirSync(root, { withFileTypes: true }).flatMap((entry) =>
            entry.isDirectory() ? assetFiles(`${root}/${entry.name}`).map((file) => `${entry.name}/${file}`)
              : [entry.name]).sort();
          const keptFiles = ['catalog.json', ...entries.flatMap(({ manifest }) =>
            [`${manifest.id}/manifest.json`, `${manifest.id}/draft.json`])].sort();
          for (const root of ['/app/apps/api/templates', '/app/apps/api/dist/catalog']) {
            assert.deepEqual(assetFiles(root), keptFiles,
              'Only the index, manifests and independent drafts may ship; no configured graphs or support assets');
          }
          const supportDir = '/app/apps/api/dist/templates/github';
          assert.deepEqual(existsSync(supportDir) ? readdirSync(supportDir, { recursive: true }) : [], []);
          for (const name of ['runtime', 'binding', 'scripts', 'authority', 'prerequisites',
            'subjects', 'failures', 'support-result', 'instances']) {
            assert.equal(existsSync(`/app/apps/api/dist/templates/${name}.js`), false);
          }
          for (const { manifest, draft } of entries) {
            assert.ok(draft.nodes.length > 0);
            const first = await catalog.draft(manifest.id);
            const second = await catalog.draft(manifest.id);
            assert.deepEqual(first, draft);
            assert.notEqual(first, second);
            first.nodes[0].label = 'Changed copy';
            assert.deepEqual(second, draft);
            assert.deepEqual(await catalog.draft(manifest.id), draft);
            console.log(JSON.stringify({ template: manifest.id, version: manifest.version,
              draftNodes: draft.nodes.length }));
          }
          JS
