name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Offline upgrade acceptance
        run: pnpm test:upgrade

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Layer rules
        run: pnpm check:layers

      - name: Design token rules
        run: pnpm check:tokens

      - name: Dependency graph rules
        run: pnpm check:deps

      - name: Shipped templates and deliberate-invalid refusal
        run: pnpm check:templates

      - name: Unit tests with coverage thresholds
        # Each Vitest package owns its worker pool; avoid multiplying pools on the CI host.
        run: pnpm exec turbo run test:coverage --concurrency=1

      - name: Licence allowlist
        run: pnpm check:licenses

      - name: Generated docs are current
        run: pnpm check:docs

      - name: Design token contrast table is current and passing
        run: pnpm check:contrast

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/coverage-summary.json
            apps/*/coverage/coverage-summary.json
          if-no-files-found: ignore

  template-image:
    name: Template image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the distributed image
        run: docker build --tag graphgoblin-template-check .

      - name: Load installed templates without network or writable storage
        run: |
          docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node graphgoblin-template-check --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { TemplateCatalog } from '/app/apps/api/dist/templates/catalog.js';
          const entries = await new TemplateCatalog('/app/apps/api/dist/catalog', '/app/apps/api').list();
          assert.ok(entries.length > 0, 'The runtime image must contain its template catalog');
          assert.ok(entries.some(({ bundle }) => bundle.manifest.id === 'starter'));
          for (const { bundle, support } of entries) {
            assert.ok(Object.keys(bundle.loops).length > 0);
            console.log(JSON.stringify({ template: bundle.manifest.id, version: bundle.manifest.version,
              loops: Object.keys(bundle.loops), supportPackaged: support !== undefined }));
          }
          JS
