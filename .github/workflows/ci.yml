name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-launcher:
    name: Windows launcher
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LIVE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: 'Build with #436 run receipt'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_OPTIONAL_LOCKS = '0'
          function Read-Git([string[]]$Arguments) {
            $value = & git.exe @Arguments
            if ($LASTEXITCODE -ne 0) { throw 'Git identity query failed.' }
            $value
          }
          $checkout = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          $node = (Get-Command node.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $nodeVersion = & $node --version
          if ($LASTEXITCODE -ne 0 -or $nodeVersion -notmatch '^v22\.\d+\.\d+$' -or
              [version]$nodeVersion.Substring(1) -lt [version]'22.22.2') { throw 'Bind supported Node 22.' }
          $head = Read-Git @('rev-parse','HEAD')
          $tree = Read-Git @('rev-parse','HEAD^{tree}')
          if ($head -cne $env:GITHUB_SHA -or (Read-Git @('status','--porcelain=v1','--untracked-files=all'))) {
            throw 'The actual workflow checkout differs from the admitted source.'
          }
          $index = Read-Git @('rev-parse','--path-format=absolute','--git-path','index')
          $before = (Get-FileHash -Algorithm SHA256 -LiteralPath $index).Hash.ToLowerInvariant()
          $control = Join-Path $env:RUNNER_TEMP "qa436-carrier-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $control) { throw 'Carrier control directory already exists.' }
          New-Item -ItemType Directory -Path $control | Out-Null
          $beforeStart = [DateTime]::UtcNow.ToString('o')
          $PSNativeCommandUseErrorActionPreference = $false
          & pnpm.cmd build
          $buildExit = $LASTEXITCODE
          $ended = [DateTime]::UtcNow.ToString('o')
          $receipt = [ordered]@{
            schema='gg436-hosted-build-exit/v1'; command='pnpm.cmd build'; exitCode=$buildExit
            checkout=$checkout; head=$head; tree=$tree; githubRunId=$env:GITHUB_RUN_ID; githubRunAttempt=$env:GITHUB_RUN_ATTEMPT
            startedUtc=$beforeStart; exitedUtc=$ended; nodePath=$node; nodeVersion=$nodeVersion
            nodeSha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $node).Hash.ToLowerInvariant()
            beforeIndexSha256=$before; afterIndexSha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $index).Hash.ToLowerInvariant()
          }
          $receiptPath = Join-Path $control 'build-exit.json'
          [IO.File]::WriteAllText($receiptPath,($receipt | ConvertTo-Json -Depth 6)+[char]10,[Text.UTF8Encoding]::new($false))
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "QA436_CONTROL=$control"
          if ($buildExit -ne 0) { exit $buildExit }
          if ($receipt.beforeIndexSha256 -cne $receipt.afterIndexSha256 -or
              (Read-Git @('rev-parse','HEAD')) -cne $head -or
              (Read-Git @('status','--porcelain=v1','--untracked-files=all'))) { throw 'Build changed the bound source.' }
      - name: Native Windows launcher acceptance
        run: pnpm test:windows-launcher
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher
          path: .tmp/windows-launcher-*/
          if-no-files-found: warn
      - name: 'Admitted #436 hosted installer and process-start observation'
        shell: pwsh
        env:
          QA436_PHASE: candidate
          QA436_NAME: qa436-candidate-corrected
          QA436_BASE_COMMIT: be633141be5a0cd2b4f960a46761fabbf2cb82c7
          QA436_BASE_TREE: decd1ca26c9bd63d942e939e65e2b2604d7f2652
          QA436_PRODUCT_COMMIT: a73b9a887c50f51d4fc4af54aa806fda42e31abf
          QA436_PRODUCT_TREE: 0bb9182fa29eecaf196436b4e9e8a19605239c60
          QA436_PACKET: docs/qa/2026-11-16-installer-validation-candidate-preparation/raw/budget/execution
          QA436_DRIVER: docs/qa/2026-11-16-installer-validation-candidate-preparation/raw/budget/native
          QA436_PACKET_SHA: e47289e57831e65eb4b39569cc9e5305318a0ec6165e1a7b87f469e57132b177
          QA436_CARRIER_FILES: |-
            [".github/workflows/ci.yml"]
          QA436_VALIDATOR_ARGUMENT: '--validate-install'
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_OPTIONAL_LOCKS = '0'
          $workspace = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          $control = Get-Item -LiteralPath $env:QA436_CONTROL -Force
          $expectedControl = Join-Path $env:RUNNER_TEMP "qa436-carrier-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($control.FullName -cne $expectedControl -or !$control.PSIsContainer -or
              ($control.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Unexpected carrier control directory.' }
          $packetRoot = Join-Path $control.FullName 'packets'
          if (Test-Path -LiteralPath $packetRoot) { throw 'Expected a fresh packet materialization directory.' }
          New-Item -ItemType Directory -Path $packetRoot | Out-Null
          function Copy-QaPacket([string]$Source, [string]$Destination, [string[]]$Names) {
            $root = Get-Item -LiteralPath $Source -Force
            if (!$root.PSIsContainer -or ($root.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw 'Expected a plain carried packet directory.'
            }
            $expected = @($Names | ForEach-Object { if ($_ -ceq 'README.md') { 'README.md.txt' } else { $_ } } | Sort-Object -CaseSensitive)
            $entries = @(Get-ChildItem -LiteralPath $root.FullName -Recurse -Force)
            if (@($entries | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count) {
              throw 'Carried packet contains a reparse point.'
            }
            $actual = @($entries | Where-Object { !$_.PSIsContainer } | ForEach-Object {
              [IO.Path]::GetRelativePath($root.FullName, $_.FullName).Replace('\', '/')
            } | Sort-Object -CaseSensitive)
            if (($actual -join '|') -cne ($expected -join '|')) { throw 'Carried packet membership differs from the allowlist.' }
            New-Item -ItemType Directory -Path $Destination | Out-Null
            foreach ($name in $Names) {
              $stored = if ($name -ceq 'README.md') { 'README.md.txt' } else { $name }
              $sourceFile = Join-Path $root.FullName $stored
              $target = Join-Path $Destination $name
              $targetDir = Split-Path -Parent $target
              if (!(Test-Path -LiteralPath $targetDir -PathType Container)) {
                New-Item -ItemType Directory -Path $targetDir | Out-Null
              }
              [IO.File]::Copy($sourceFile, $target, $false)
            }
            (Get-Item -LiteralPath $Destination).FullName
          }
          $packet = Copy-QaPacket (Join-Path $workspace $env:QA436_PACKET) (Join-Path $packetRoot 'execution') @(
            'ProcessTrace.cs',
            'README.md',
            'SHA256SUMS.txt',
            'admission.example.json',
            'bind.mjs',
            'carrier-steps.example.yml',
            'inventory/artifacts.mjs',
            'inventory/common.mjs',
            'observe.ps1',
            'supervise.ps1',
            'syntax-readback.json'
          )
          $driver = Copy-QaPacket (Join-Path $workspace $env:QA436_DRIVER) (Join-Path $packetRoot 'native') @(
            'README.md',
            'SHA256SUMS.txt',
            'invoke.ps1',
            'run.ps1',
            'syntax-readback.json',
            'version-fixture.cs',
            'windows.cs'
          )
          $utf8 = [Text.UTF8Encoding]::new($false)
          $requiredDriverSha = '92633a444b327c8d9128aec387119fc5e7570093feece51d2aa57f647fce1fba'
          foreach ($item in @(@{path=$packet; digest=$env:QA436_PACKET_SHA}, @{path=$driver; digest=$requiredDriverSha})) {
            $manifest = Join-Path $item.path 'SHA256SUMS.txt'
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $manifest).Hash.ToLowerInvariant() -cne $item.digest) {
              throw 'Reviewed manifest digest mismatch.'
            }
            foreach ($line in Get-Content -LiteralPath $manifest) {
              if ($line -cnotmatch '^([a-f0-9]{64})  ([A-Za-z0-9_./-]+)$' -or
                  $Matches[2].StartsWith('/') -or $Matches[2].Contains('..')) { throw 'Unsafe manifest member.' }
              $expected = $Matches[1]
              $boundFile = Get-Item -LiteralPath (Join-Path $item.path $Matches[2]) -Force
              if ($boundFile.PSIsContainer -or ($boundFile.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
                  (Get-FileHash -Algorithm SHA256 -LiteralPath $boundFile.FullName).Hash.ToLowerInvariant() -cne $expected) {
                throw 'Reviewed fixture or carrier bytes differ.'
              }
            }
          }
          $receiptPath = Join-Path $env:QA436_CONTROL 'build-exit.json'
          $build = Get-Content -Raw -LiteralPath $receiptPath | ConvertFrom-Json -AsHashtable
          if ($build.exitCode -ne 0 -or $build.head -cne $env:GITHUB_SHA) { throw 'Build proof did not complete.' }
          $knownChrome = @(
            foreach ($programFiles in @([Environment]::GetFolderPath('ProgramFiles'), [Environment]::GetFolderPath('ProgramFilesX86'))) {
              if ($programFiles) {
                $application = Join-Path $programFiles 'Google\Chrome\Application'
                $binary = Join-Path $application 'chrome.exe'
                $proxy = Join-Path $application 'chrome_proxy.exe'
                if ((Test-Path -LiteralPath $binary -PathType Leaf) -and (Test-Path -LiteralPath $proxy -PathType Leaf)) {
                  (Get-Item -LiteralPath $proxy).FullName
                }
              }
            }
          ) | Select-Object -Unique
          if (@($knownChrome).Count -ne 1) { throw 'Expected one checked image Chrome proxy and adjacent browser.' }
          $proxyPath = @($knownChrome)[0]
          $powerShell = (Get-Item -LiteralPath (Join-Path $PSHOME 'pwsh.exe')).FullName
          $compiler = (Get-Item -LiteralPath (Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe')).FullName
          $decoder = (Get-Item -LiteralPath (Join-Path $env:SystemRoot 'System32\tracerpt.exe')).FullName
          $admission = [ordered]@{
            schema='gg436-hosted-admission/v1'; state='root-admitted'; phase=$env:QA436_PHASE
            checkout=$workspace; expectedCommit=$build.head; expectedTree=$build.tree
            baseCommit=$env:QA436_BASE_COMMIT; baseTree=$env:QA436_BASE_TREE
            productCommit=$env:QA436_PRODUCT_COMMIT; productTree=$env:QA436_PRODUCT_TREE
            githubRunId=$env:GITHUB_RUN_ID; githubRunAttempt=$env:GITHUB_RUN_ATTEMPT
            evidenceName=$env:QA436_NAME; driverDirectory=$driver; driverManifestSha256=$requiredDriverSha
            packetManifestSha256=$env:QA436_PACKET_SHA; carrierOnlyPaths=@(ConvertFrom-Json $env:QA436_CARRIER_FILES)
            validatorArgument=if ($env:QA436_VALIDATOR_ARGUMENT) { $env:QA436_VALIDATOR_ARGUMENT }
            buildReceipt=[ordered]@{path=$receiptPath; sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $receiptPath).Hash.ToLowerInvariant()}
            tools=[ordered]@{node=$build.nodePath; powershell=$powerShell; compiler=$compiler; tracerpt=$decoder; chromeProxy=$proxyPath
              chrome=(Get-Item -LiteralPath (Join-Path (Split-Path -Parent $proxyPath) 'chrome.exe')).FullName}
          }
          $path = Join-Path $env:QA436_CONTROL 'admission.json'
          [IO.File]::WriteAllText($path,($admission | ConvertTo-Json -Depth 10)+[char]10,$utf8)
          $sha = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          & $powerShell -NoLogo -NoProfile -NonInteractive -STA -File (Join-Path $packet 'supervise.ps1') -Admission $path -AdmissionSha256 $sha
          exit $LASTEXITCODE
      - name: 'Retain #436 evidence'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa436-candidate-corrected
          path: |
            ${{ runner.temp }}/qa436-candidate-corrected/evidence/
            ${{ runner.temp }}/qa436-candidate-corrected-supervisor/
            ${{ runner.temp }}/qa436-carrier-${{ github.run_id }}-${{ github.run_attempt }}/build-exit.json
            ${{ runner.temp }}/qa436-carrier-${{ github.run_id }}-${{ github.run_attempt }}/admission.json
          if-no-files-found: error
      - name: 'Observe #436 Windows publication rollback'
        id: qa436_rollback
        shell: pwsh
        timeout-minutes: 7
        env:
          QA436_ROLLBACK_PACKET: docs/qa/2026-11-16-installer-validation-candidate-preparation/raw/rollback
          QA436_ROLLBACK_HOSTED_MANIFEST_SHA: 1b264ce75a482249ca72083926ab0cae977e36e2ea395d32685442105c238e11
          QA436_ROLLBACK_INSTALLER_SHA: c50646bf4324388b934ddea4c04deb1f55f6919b49c867c0b21ece09cf756d99
        run: |
          $ErrorActionPreference = 'Stop'
          $packet = Join-Path $env:GITHUB_WORKSPACE $env:QA436_ROLLBACK_PACKET
          $supervisor = Join-Path $packet 'supervise-rollback.ps1'
          & $supervisor -HostedManifestSha256 $env:QA436_ROLLBACK_HOSTED_MANIFEST_SHA -InstallerSha256 $env:QA436_ROLLBACK_INSTALLER_SHA
          exit $LASTEXITCODE

      - name: 'Retain #436 rollback witness'
        if: ${{ always() && (steps.qa436_rollback.outcome == 'success' || steps.qa436_rollback.outcome == 'failure' || steps.qa436_rollback.outcome == 'cancelled') }}
        uses: actions/upload-artifact@v4
        with:
          name: qa436-rollback-corrected
          path: ${{ runner.temp }}/qa436-rollback-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          if-no-files-found: warn
          retention-days: 7
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Reset acceptance
        run: pnpm test:reset

      - name: Recovery process acceptance
        run: pnpm test:recovery-process

      - name: Chat restart acceptance
        run: pnpm test:chat-restart

      - name: Wait restart acceptance
        run: pnpm test:wait-restart

      - name: Prompt restart acceptance
        run: pnpm test:prompt-restart
      - name: Webhook retry acceptance
        run: pnpm test:webhook-retry

      - name: Current-format migration acceptance
        run: pnpm test:upgrade

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Layer rules
        run: pnpm check:layers

      - name: Migration generation is a no-op
        run: pnpm check:migrations

      - name: Design token rules
        run: pnpm check:tokens

      - name: Dependency graph rules
        run: pnpm check:deps

      - name: Shipped templates and deliberate-invalid refusal
        run: pnpm check:templates

      - name: Install Chromium for tooling browser measurements
        run: pnpm --filter @graphgoblin/web exec playwright install --with-deps chromium

      - name: Unit tests with coverage thresholds
        # Each Vitest package owns its worker pool; avoid multiplying pools on the CI host.
        run: pnpm exec turbo run test:coverage --concurrency=1

      - name: Licence allowlist
        run: pnpm check:licenses

      - name: Generated docs are current
        run: pnpm check:docs

      - name: Design token contrast table is current and passing
        run: pnpm check:contrast

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/coverage-summary.json
            apps/*/coverage/coverage-summary.json
            tooling/coverage/coverage-summary.json
          if-no-files-found: ignore

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Match Windows development and the existing Linux routing-performance job.
      GG_E2E_BROWSER_CHANNEL: msedge
      # Live checks spend subscription quota and require an installed, signed-in CLI.
      LIVE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          # issue-170-qa reads frozen golden definitions from an earlier commit with git ls-tree.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Edge
        run: pnpm --filter @graphgoblin/web exec playwright install --with-deps msedge

      - name: Build
        run: pnpm build

      - name: Functional browser suite (no retries)
        timeout-minutes: 60
        working-directory: apps/web
        run: pnpm exec playwright test --retries=0 --workers=1

      - name: Browser coverage and exclusions
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Functional browser gate

          Selected coverage: all `apps/web/e2e/**/*.spec.ts` against the built app on Edge with zero retries and one worker.
          This includes `script-recovery.spec.ts`: an isolated built API, kill/restart uncertainty, explicit retry consent, and resumed-run observation.
          The test step and report record the executed result, including any setup failure.
          The real API uses disposable storage and scripted harness/classifier boundaries; no paid provider is called.

          Skipped: `live.spec.ts` / `LIVE: build, publish, and run an inference loop against Codex from the UI`.
          It requires `LIVE=1`, an installed Codex CLI and a provider login, and spends subscription quota. CI sets `LIVE=0`.
          No other functional spec or test is skipped or gated on a provider login or installed CLI.

          Optional modes are off: `GG_FORMS_QA_PHASE` (historical before/after captures),
          `GG_ROUTING_SCREENSHOTS` (captures), `GG_ROUTING_PROFILE` (profiling), and
          `GG_ROUTING_STRICT_PERF` (stricter manual performance bounds). Their ordinary tests still run.
          `screens.capture.ts` is a manual screenshot utility, outside the `*.spec.ts` suite.
          Live/paid checks remain separate, manually authorized checks; this job schedules none.
          SUMMARY

      - name: Upload browser failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: warn

  template-image:
    name: Template image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the distributed image
        run: docker build --tag graphgoblin-template-check .

      - name: Load installed templates without network or writable storage
        run: |
          docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node graphgoblin-template-check --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync, readdirSync } from 'node:fs';
          import { TemplateCatalog } from '/app/apps/api/dist/templates/catalog.js';
          const catalog = new TemplateCatalog('/app/apps/api/dist/catalog');
          const entries = await catalog.list();
          assert.deepEqual(entries.map(({ manifest }) => manifest.id).sort(),
            ['implementation', 'qa', 'review', 'starter']);
          const assetFiles = (root) => readdirSync(root, { withFileTypes: true }).flatMap((entry) =>
            entry.isDirectory() ? assetFiles(`${root}/${entry.name}`).map((file) => `${entry.name}/${file}`)
              : [entry.name]).sort();
          const keptFiles = ['catalog.json', ...entries.flatMap(({ manifest }) =>
            [`${manifest.id}/manifest.json`, `${manifest.id}/draft.json`])].sort();
          for (const root of ['/app/apps/api/templates', '/app/apps/api/dist/catalog']) {
            assert.deepEqual(assetFiles(root), keptFiles,
              'Only the index, manifests and independent drafts may ship; no configured graphs or support assets');
          }
          const supportDir = '/app/apps/api/dist/templates/github';
          assert.deepEqual(existsSync(supportDir) ? readdirSync(supportDir, { recursive: true }) : [], []);
          for (const name of ['runtime', 'binding', 'scripts', 'authority', 'prerequisites',
            'subjects', 'failures', 'support-result', 'instances']) {
            assert.equal(existsSync(`/app/apps/api/dist/templates/${name}.js`), false);
          }
          for (const { manifest, draft } of entries) {
            assert.ok(draft.nodes.length > 0);
            const first = await catalog.draft(manifest.id);
            const second = await catalog.draft(manifest.id);
            assert.deepEqual(first, draft);
            assert.notEqual(first, second);
            first.nodes[0].label = 'Changed copy';
            assert.deepEqual(second, draft);
            assert.deepEqual(await catalog.draft(manifest.id), draft);
            console.log(JSON.stringify({ template: manifest.id, version: manifest.version,
              draftNodes: draft.nodes.length }));
          }
          JS
